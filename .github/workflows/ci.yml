name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 린트 (ruff)
        run: ruff check .
      - name: 테스트 (pytest)
        run: pytest
